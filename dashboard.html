<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Signage — Dashboard</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/menu.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;600;700&display=swap">
</head>
<body>
  <div class="topbar">
    <h1>Digital Signage</h1>
    <div>
      <span class="who" id="whoami"></span>
      <button class="secondary small" onclick="logout()" style="margin-left:12px;">Log out</button>
    </div>
  </div>

  <div class="wrap">

    <div class="card" id="screenPicker" style="display:none;">
      <label for="screenSelect">Screen</label>
      <select id="screenSelect" onchange="selectScreen(this.value)"></select>
    </div>

    <div id="mainArea"></div>

  </div>

  <!-- Schedule pop-up -->
  <div class="modal-backdrop" id="scheduleModal" onclick="if(event.target===this)closeSchedule()">
    <div class="modal">
      <h2>Schedule</h2>
      <div class="sub" id="schedFile"></div>

      <label>Play on these days (leave all unticked = every day)</label>
      <div class="day-row" id="schedDays"></div>

      <label style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <input type="checkbox" id="schedAllDay" style="width:auto; margin:0;" onchange="toggleAllDay()">
        Play all day
      </label>
      <div id="schedTimes">
        <label>From</label>
        <div class="time-row" id="schedFrom"></div>
        <label>Until</label>
        <div class="time-row" id="schedUntil"></div>
      </div>

      <div class="row">
        <div>
          <label for="schedStartDate">Start date (optional)</label>
          <input type="date" id="schedStartDate">
        </div>
        <div>
          <label for="schedEndDate">End date (optional)</label>
          <input type="date" id="schedEndDate">
        </div>
      </div>
      <p style="color:var(--muted); font-size:12px; margin-top:10px;">All times are Malaysia time.</p>

      <div id="schedMsg" class="msg"></div>
      <div class="modal-actions">
        <button class="icon-btn" onclick="clearSchedule()">Play always (clear)</button>
        <button class="secondary" onclick="closeSchedule()">Cancel</button>
        <button onclick="saveSchedule()" id="schedSaveBtn">Save schedule</button>
      </div>
    </div>
  </div>

  <!-- Menu board editor -->
  <div class="modal-backdrop" id="menuModal">
    <div class="modal wide">
      <h2 id="menuModalTitle">Menu board</h2>
      <div class="menu-edit-grid">
        <div>
          <div id="starterRow" style="margin-bottom:12px;">
            <label for="mStarter">Start from a ready-made template</label>
            <select id="mStarter" onchange="applyStarter(this.value)"></select>
          </div>
          <div class="row">
            <div>
              <label for="mTitle">Menu title</label>
              <input type="text" id="mTitle" placeholder="e.g. Breakfast Menu"
                     oninput="menuDraft.title=this.value; refreshMenuPreview()">
            </div>
            <div style="flex:0 0 100px;">
              <label for="mCurrency">Currency</label>
              <input type="text" id="mCurrency" maxlength="6" oninput="menuDraft.currency=this.value; refreshMenuPreview()">
            </div>
          </div>

          <label>Look</label>
          <div class="day-row" id="mLooks"></div>

          <div class="row">
            <div>
              <label for="mAccent">Accent colour</label>
              <input type="color" id="mAccent" class="color-input" oninput="menuDraft.accent=this.value; refreshMenuPreview()">
            </div>
            <div>
              <label for="mDuration">Seconds per slide</label>
              <input type="number" id="mDuration" min="4" max="120" oninput="menuDraft.duration_seconds=this.value">
            </div>
          </div>

          <label style="margin-top:14px;">Categories and items</label>
          <div id="mCats"></div>
          <button class="small secondary" onclick="addCat()">+ Add category</button>
        </div>

        <div class="menu-edit-preview">
          <label>Preview (how it looks on a TV)</label>
          <div id="mPreview" class="mpreview"></div>
          <div id="mPreviewNav" class="mpreview-nav"></div>
          <p style="color:var(--muted); font-size:12px; margin-top:8px;">
            Long menus split into several slides automatically, and the player rotates through them.
            Prices typed as numbers show as RM 12.50; you can also type text such as "S 4 / L 6".
          </p>
        </div>
      </div>

      <div id="mMsg" class="msg"></div>
      <div class="modal-actions">
        <button class="secondary" onclick="closeMenuEditor()">Cancel</button>
        <button onclick="saveMenu()" id="mSaveBtn">Save menu board</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/schedule.js"></script>
  <script src="assets/fonts.js"></script>
  <script src="assets/menu.js"></script>
  <script src="assets/menu-starters.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let myProfile = null;
    let myScreens = [];
    let currentScreen = null;
    let mediaCache = [];
    let menuCache = [];

    (async () => {
      const session = await requireSession();
      if (!session) return;
      myProfile = await getMyProfile();
      if (!myProfile) {
        document.getElementById("mainArea").innerHTML =
          '<div class="card">Your login isn\'t linked to an organization yet. Contact your administrator.</div>';
        return;
      }
      const { data: { user } } = await db.auth.getUser();
      document.getElementById("whoami").textContent = user.email;

      const { data: screens, error } = await db
        .from("screens")
        .select("*")
        .eq("org_id", myProfile.org_id)
        .order("created_at", { ascending: true });

      if (error) {
        document.getElementById("mainArea").innerHTML = '<div class="card">Failed to load: ' + error.message + '</div>';
        return;
      }
      myScreens = screens || [];

      if (!myScreens.length) {
        document.getElementById("mainArea").innerHTML =
          '<div class="card">No screen has been set up for your organization yet. Contact your administrator.</div>';
        return;
      }

      if (myScreens.length > 1) {
        const picker = document.getElementById("screenPicker");
        picker.style.display = "block";
        document.getElementById("screenSelect").innerHTML =
          myScreens.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
      }

      selectScreen(myScreens[0].id);
    })();

    // Refresh the online/offline badge every 30 seconds.
    async function refreshScreenStatus() {
      if (!currentScreen) return;
      const { data } = await db.from("screens").select("last_seen_at").eq("id", currentScreen.id).single();
      if (!data) return;
      currentScreen.last_seen_at = data.last_seen_at;
      const el = document.getElementById("screenStatus");
      if (el) el.innerHTML = statusPillHtml(data.last_seen_at);
    }
    setInterval(refreshScreenStatus, 30000);

    function selectScreen(id) {
      currentScreen = myScreens.find(s => s.id === id);
      renderMain();
      loadTicker();
      loadMedia();
      loadMenus();
    }

    function renderMain() {
      const playerUrl = window.location.origin + window.location.pathname.replace("dashboard.html", "player.html")
        + "?screen=" + currentScreen.slug;

      document.getElementById("mainArea").innerHTML = `
        <div class="card">
          <h2>${escapeHtml(currentScreen.name)} — player link</h2>
          <p style="color:var(--muted); font-size:13px; margin-bottom:8px;">Open this address in the browser on the TV / display PC. It always shows your latest content.</p>
          <div class="link-url">${playerUrl}</div>
          <button class="small secondary" style="margin-top:10px;" onclick="navigator.clipboard.writeText('${playerUrl}')">Copy link</button>
          <div style="margin-top:12px; font-size:13px;">
            Screen status: <span id="screenStatus">${statusPillHtml(currentScreen.last_seen_at)}</span>
          </div>
        </div>

        <div class="card" id="hoursCard"></div>

        <div class="card" id="layoutCard"></div>

        <div class="card" id="styleCard"></div>

        <div class="card">
          <h2>Screen settings</h2>
          <div class="row">
            <div>
              <label for="tickerSpeed">Ticker scroll speed (higher = faster)</label>
              <input type="number" id="tickerSpeed" value="${currentScreen.ticker_speed}">
            </div>
            <div>
              <label for="imageDuration">Seconds each image stays on screen</label>
              <input type="number" id="imageDuration" value="${currentScreen.image_duration}">
            </div>
            <div style="flex:0 0 auto; align-self:flex-end;">
              <button onclick="saveSettings()">Save</button>
            </div>
          </div>
          <div id="settingsMsg" class="msg"></div>
        </div>

        <div class="card">
          <h2>Scrolling ticker messages</h2>
          <div id="tickerList" class="empty">Loading...</div>
          <div class="row" style="margin-top:12px;">
            <div><input type="text" id="newTicker" placeholder="Type a new message"></div>
            <div style="flex:0 0 auto;"><button class="secondary" onclick="addTicker()">Add message</button></div>
          </div>
        </div>

        <div class="card">
          <h2>Videos &amp; images</h2>
          <div id="mediaList" class="empty">Loading...</div>
          <div class="row" style="margin-top:12px; align-items:center;">
            <div><input type="file" id="mediaFile" accept="image/*,video/*"></div>
            <div style="flex:0 0 auto;"><button class="secondary" onclick="uploadMedia('main')" id="uploadBtn">Upload</button></div>
          </div>
          <div id="mediaMsg" class="msg"></div>
        </div>

        <div class="card" id="sideCard" style="display:${(currentScreen.layout || 'full') === 'full' ? 'none' : 'block'};">
          <h2>Side panel images</h2>
          <p style="color:var(--muted); font-size:13px; margin-bottom:10px;">
            These images rotate in the side panel, separately from the main area. Good for notices, promotions or staff photos.
          </p>
          <div id="sideList" class="empty">Loading...</div>
          <div class="row" style="margin-top:12px; align-items:center;">
            <div><input type="file" id="sideFile" accept="image/*"></div>
            <div style="flex:0 0 auto;"><button class="secondary" onclick="uploadMedia('side')" id="sideUploadBtn">Upload</button></div>
          </div>
          <div id="sideMsg" class="msg"></div>
        </div>

        <div class="card" id="menuCard">
          <h2>Menu boards</h2>
          <p style="color:var(--muted); font-size:13px; margin-bottom:10px;">
            Create a menu or price list that plays on your screen between your images and videos.
            Use <b>Schedule</b> to show a menu only at certain days and times (for example, Breakfast 7 AM to 11 AM).
          </p>
          <div id="menuList" class="empty">Loading...</div>
          <div style="margin-top:12px;">
            <button class="secondary" onclick="openMenuEditor(null)">+ New menu board</button>
          </div>
        </div>

        <div class="card">
          <h2>Corporate logo</h2>
          <p style="color:var(--muted); font-size:13px; margin-bottom:10px;">
            Upload your logo and choose which top corner it appears in on the screen.
          </p>
          <div id="logoPreview"></div>
          <div class="row" style="margin-top:12px; align-items:center;">
            <div><input type="file" id="logoFile" accept="image/*"></div>
            <div>
              <label for="logoPosition">Corner</label>
              <select id="logoPosition">
                <option value="left">Top left</option>
                <option value="right">Top right</option>
              </select>
            </div>
            <div style="flex:0 0 auto; align-self:flex-end;"><button class="secondary" onclick="uploadLogo()" id="logoUploadBtn">Upload &amp; save</button></div>
          </div>
          <div id="logoMsg" class="msg"></div>
        </div>
      `;

      renderLogoCard();
      renderHoursCard();
      renderLayoutCard();
      renderStyleCard();
    }

    // ---------- Screen hours ----------

    // Build a week from the older single-window settings (or a sensible default).
    function weekFromScreen(s) {
      if (s.hours_week && typeof s.hours_week === "object") return s.hours_week;
      const week = {};
      if (s.hours_start && s.hours_end) {
        const days = (s.hours_days && s.hours_days.length) ? s.hours_days : [0,1,2,3,4,5,6];
        days.forEach(d => { week[d] = { start: s.hours_start, end: s.hours_end }; });
        return week;
      }
      [1,2,3,4,5].forEach(d => { week[d] = { start: "08:00:00", end: "18:00:00" }; });
      return week;
    }

    function renderHoursCard() {
      const s = currentScreen;
      document.getElementById("hoursCard").innerHTML = `
        <h2>Screen hours</h2>
        <p style="color:var(--muted); font-size:13px; margin-bottom:12px;">
          Choose when this screen shows your content, with different hours for each day.
          Leave a day unticked if the screen is closed that day. Outside these hours the screen goes dark.
          All times are Malaysia time.
        </p>
        <label style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <input type="checkbox" id="hrsEnabled" style="width:auto; margin:0;" onchange="toggleHours()">
          Only show content during set hours
        </label>
        <div id="hrsBody">
          ${WEEK_ORDER.map(d => `
            <div class="hrs-row">
              <span class="hrs-day">${DAY_NAMES[d]}</span>
              <label class="hrs-open"><input type="checkbox" id="hrsOpen${d}" onchange="toggleHrsDay(${d})"> Open</label>
              <span class="hrs-times" id="hrsTimes${d}">
                <span class="time-row">${timeSelectsHtml("hrs" + d + "From")}</span>
                <span class="to">to</span>
                <span class="time-row">${timeSelectsHtml("hrs" + d + "Until")}</span>
              </span>
              <span class="hrs-closed" id="hrsClosed${d}">Closed</span>
            </div>`).join("")}
          <div style="margin:12px 0 16px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="small secondary" onclick="copyMonday(false)">Copy Monday to Mon–Fri</button>
            <button class="small secondary" onclick="copyMonday(true)">Copy Monday to all days</button>
          </div>
          <label>Outside these hours, show</label>
          <div class="day-row">
            <label><input type="radio" name="hrsMode" value="black"> Black screen</label>
            <label><input type="radio" name="hrsMode" value="logo"> My logo on black</label>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <button onclick="saveHours()" id="hrsSaveBtn">Save hours</button>
          <span id="hrsNow" style="font-size:13px;"></span>
        </div>
        <div id="hrsMsg" class="msg"></div>
      `;

      document.getElementById("hrsEnabled").checked = !!s.hours_enabled;
      const week = weekFromScreen(s);
      WEEK_ORDER.forEach(d => {
        const w = week[d];
        const open = !!(w && w.start && w.end);
        document.getElementById("hrsOpen" + d).checked = open;
        setTimeOn("hrs" + d + "From", open ? w.start : "08:00:00");
        setTimeOn("hrs" + d + "Until", open ? w.end : "18:00:00");
        toggleHrsDay(d);
      });
      document.querySelector(`input[name="hrsMode"][value="${s.off_hours_mode === "logo" ? "logo" : "black"}"]`).checked = true;
      toggleHours();
      updateHoursNow();
    }

    function toggleHours() {
      document.getElementById("hrsBody").style.display =
        document.getElementById("hrsEnabled").checked ? "block" : "none";
    }

    function toggleHrsDay(d) {
      const open = document.getElementById("hrsOpen" + d).checked;
      document.getElementById("hrsTimes" + d).style.display = open ? "inline-flex" : "none";
      document.getElementById("hrsClosed" + d).style.display = open ? "none" : "inline";
    }

    // Copy Monday's open/closed state and times onto other days.
    function copyMonday(allDays) {
      const open = document.getElementById("hrsOpen1").checked;
      const from = getTimeFrom("hrs1From");
      const until = getTimeFrom("hrs1Until");
      const targets = allDays ? [2,3,4,5,6,0] : [2,3,4,5];
      targets.forEach(d => {
        document.getElementById("hrsOpen" + d).checked = open;
        setTimeOn("hrs" + d + "From", from);
        setTimeOn("hrs" + d + "Until", until);
        toggleHrsDay(d);
      });
    }

    function updateHoursNow() {
      const el = document.getElementById("hrsNow");
      if (!el) return;
      if (!currentScreen.hours_enabled) {
        el.innerHTML = '<span class="pill">Always on</span>';
        return;
      }
      const open = isWithinHours(currentScreen);
      el.innerHTML = `<span class="pill ${open ? "online" : "inactive"}">${open ? "Open now" : "Closed now"}</span>
        <span style="color:var(--muted);">${escapeHtml(hoursSummary(currentScreen))}</span>`;
    }

    async function saveHours() {
      const msg = document.getElementById("hrsMsg");
      const enabled = document.getElementById("hrsEnabled").checked;
      const mode = document.querySelector('input[name="hrsMode"]:checked').value;

      const week = {};
      for (const d of WEEK_ORDER) {
        if (!document.getElementById("hrsOpen" + d).checked) continue;
        const start = getTimeFrom("hrs" + d + "From");
        const end = getTimeFrom("hrs" + d + "Until");
        if (start === end) {
          showMessage(msg, DAY_NAMES[d] + ": 'From' and 'To' cannot be the same time.", true);
          return;
        }
        week[d] = { start, end };
      }
      if (enabled && Object.keys(week).length === 0) {
        showMessage(msg, "Tick at least one day as Open, or untick 'Only show content during set hours'.", true);
        return;
      }

      const fields = { hours_enabled: enabled, hours_week: week, off_hours_mode: mode };
      const btn = document.getElementById("hrsSaveBtn");
      btn.disabled = true;
      const { data, error } = await db.from("screens").update(fields).eq("id", currentScreen.id).select();
      btn.disabled = false;
      if (error) { showMessage(msg, error.message, true); return; }
      if (!data || !data.length) { showMessage(msg, "Could not save. Please contact your administrator.", true); return; }

      Object.assign(currentScreen, fields);
      showMessage(msg, "Saved. The screen picks this up within about 30 seconds.", false);
      updateHoursNow();
    }

    // Keep the "Open now / Closed now" badge fresh.
    setInterval(() => { if (currentScreen) updateHoursNow(); }, 60000);

    // ---------- Corporate logo ----------

    function renderLogoCard() {
      document.getElementById("logoPosition").value = currentScreen.logo_position || "left";

      const previewEl = document.getElementById("logoPreview");
      if (currentScreen.logo_path) {
        const url = publicMediaUrl(currentScreen.logo_path);
        previewEl.innerHTML = `
          <div style="display:flex; align-items:center; gap:14px;">
            <img src="${url}" alt="Current logo" style="max-height:60px; max-width:180px; background:#f5f2ec; border:1px solid var(--border); border-radius:6px; padding:6px;">
            <span style="font-size:13px; color:var(--muted);">Currently shown top-${currentScreen.logo_position || "left"}</span>
            <button class="icon-btn" onclick="removeLogo()">Remove</button>
          </div>
        `;
      } else {
        previewEl.innerHTML = '<div class="empty">No logo uploaded yet.</div>';
      }
    }

    async function uploadLogo() {
      const fileInput = document.getElementById("logoFile");
      const position = document.getElementById("logoPosition").value;
      const msg = document.getElementById("logoMsg");
      const file = fileInput.files[0];

      if (!file) {
        // No new file chosen — just update the corner for the existing logo.
        if (!currentScreen.logo_path) { showMessage(msg, "Choose a logo image first.", true); return; }
        const { error } = await db.from("screens").update({ logo_position: position }).eq("id", currentScreen.id);
        if (error) { showMessage(msg, error.message, true); return; }
        currentScreen.logo_position = position;
        renderLogoCard();
        showMessage(msg, "Position updated.", false);
        return;
      }

      const btn = document.getElementById("logoUploadBtn");
      btn.disabled = true;
      showMessage(msg, "Uploading...", false);

      const oldPath = currentScreen.logo_path;
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = `${myProfile.org_id}/${currentScreen.id}/logo-${Date.now()}-${safeName}`;

      const { error: uploadError } = await db.storage.from("media").upload(path, file);
      if (uploadError) { showMessage(msg, uploadError.message, true); btn.disabled = false; return; }

      const { error: updateError } = await db.from("screens")
        .update({ logo_path: path, logo_position: position })
        .eq("id", currentScreen.id);
      if (updateError) { showMessage(msg, updateError.message, true); btn.disabled = false; return; }

      if (oldPath) await db.storage.from("media").remove([oldPath]);

      currentScreen.logo_path = path;
      currentScreen.logo_position = position;
      fileInput.value = "";
      btn.disabled = false;
      renderLogoCard();
      showMessage(msg, "Logo saved.", false);
    }

    async function removeLogo() {
      if (!confirm("Remove the logo from this screen?")) return;
      const path = currentScreen.logo_path;
      const { error } = await db.from("screens").update({ logo_path: null }).eq("id", currentScreen.id);
      if (error) { alert(error.message); return; }
      if (path) await db.storage.from("media").remove([path]);
      currentScreen.logo_path = null;
      renderLogoCard();
    }

    async function saveSettings() {
      const ticker_speed = parseInt(document.getElementById("tickerSpeed").value, 10) || 340;
      const image_duration = parseInt(document.getElementById("imageDuration").value, 10) || 8;
      const msg = document.getElementById("settingsMsg");
      const { error } = await db.from("screens")
        .update({ ticker_speed, image_duration })
        .eq("id", currentScreen.id);
      if (error) { showMessage(msg, error.message, true); return; }
      currentScreen.ticker_speed = ticker_speed;
      currentScreen.image_duration = image_duration;
      showMessage(msg, "Saved.", false);
    }

    // ---------- Ticker messages ----------

    async function loadTicker() {
      const listEl = document.getElementById("tickerList");
      const { data, error } = await db
        .from("ticker_messages")
        .select("*")
        .eq("screen_id", currentScreen.id)
        .order("sort_order", { ascending: true });
      if (error) { listEl.textContent = "Failed to load: " + error.message; return; }
      if (!data.length) { listEl.innerHTML = '<div class="empty">No messages yet.</div>'; return; }

      listEl.innerHTML = `
        <table>
          <thead><tr><th>Message</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${data.map(t => `
              <tr>
                <td>${escapeHtml(t.message)}</td>
                <td><span class="pill ${t.active ? 'active' : 'inactive'}">${t.active ? 'Active' : 'Hidden'}</span></td>
                <td style="text-align:right; white-space:nowrap;">
                  <button class="icon-btn" onclick="toggleTicker('${t.id}', ${!t.active})">${t.active ? 'Hide' : 'Show'}</button>
                  <button class="icon-btn" onclick="deleteTicker('${t.id}')">Delete</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    async function addTicker() {
      const input = document.getElementById("newTicker");
      const message = input.value.trim();
      if (!message) return;
      const { error } = await db.from("ticker_messages").insert({
        screen_id: currentScreen.id, message, active: true, sort_order: Date.now()
      });
      if (error) { alert(error.message); return; }
      input.value = "";
      await loadTicker();
    }

    async function toggleTicker(id, active) {
      await db.from("ticker_messages").update({ active }).eq("id", id);
      await loadTicker();
    }

    async function deleteTicker(id) {
      if (!confirm("Delete this message?")) return;
      await db.from("ticker_messages").delete().eq("id", id);
      await loadTicker();
    }

    // ---------- Media ----------

    async function loadMedia() {
      const listEl = document.getElementById("mediaList");
      const { data, error } = await db
        .from("media_items")
        .select("*")
        .eq("screen_id", currentScreen.id)
        .order("sort_order", { ascending: true });
      if (error) { listEl.textContent = "Failed to load: " + error.message; return; }
      mediaCache = data;
      renderSideList(data.filter(m => m.zone === "side"));
      const mainItems = data.filter(m => m.zone !== "side");
      if (!mainItems.length) { listEl.innerHTML = '<div class="empty">No videos or images yet.</div>'; return; }

      listEl.innerHTML = `
        <table>
          <thead><tr><th>File</th><th>Type</th><th>Schedule</th><th></th></tr></thead>
          <tbody>
            ${mainItems.map(m => `
              <tr>
                <td>${escapeHtml(m.storage_path.split("/").pop())}</td>
                <td>${m.type}</td>
                <td style="font-size:13px;">
                  ${escapeHtml(scheduleSummary(m))}
                  ${hasSchedule(m) ? `<br><span class="pill ${isScheduledNow(m) ? 'online' : 'inactive'}">${isScheduledNow(m) ? 'Playing now' : 'Not playing now'}</span>` : ''}
                </td>
                <td style="text-align:right; white-space:nowrap;">
                  <button class="icon-btn" onclick="openSchedule('${m.id}')">Schedule</button>
                  <button class="icon-btn" onclick="deleteMedia('${m.id}', '${m.storage_path}')">Delete</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderSideList(items) {
      const el = document.getElementById("sideList");
      if (!el) return;
      if (!items.length) { el.innerHTML = '<div class="empty">No side panel images yet.</div>'; return; }
      el.innerHTML = `
        <table>
          <thead><tr><th>Image</th><th>Schedule</th><th></th></tr></thead>
          <tbody>
            ${items.map(m => `
              <tr>
                <td>${escapeHtml(m.storage_path.split("/").pop())}</td>
                <td style="font-size:13px;">
                  ${escapeHtml(scheduleSummary(m))}
                  ${hasSchedule(m) ? `<br><span class="pill ${isScheduledNow(m) ? 'online' : 'inactive'}">${isScheduledNow(m) ? 'Playing now' : 'Not playing now'}</span>` : ''}
                </td>
                <td style="text-align:right; white-space:nowrap;">
                  <button class="icon-btn" onclick="openSchedule('${m.id}')">Schedule</button>
                  <button class="icon-btn" onclick="deleteMedia('${m.id}', '${m.storage_path}')">Delete</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`;

    // ---------- Screen layout ----------

    const LAYOUTS = [
      { id: "full",   name: "Full screen",           note: "Videos and images fill the whole screen." },
      { id: "right",  name: "Main + right panel",    note: "Logo, clock and side images on the right. Good for offices and clinics." },
      { id: "left",   name: "Main + left panel",     note: "Same, with the panel on the left." },
      { id: "bottom", name: "Main + bottom strip",   note: "Logo, clock and side images in a strip under the main area." },
    ];
    let layoutPick = "full";

    function renderLayoutCard() {
      layoutPick = currentScreen.layout || "full";
      document.getElementById("layoutCard").innerHTML = `
        <h2>Screen layout</h2>
        <p style="color:var(--muted); font-size:13px; margin-bottom:12px;">
          Choose how the screen is divided. The panel shows your logo (or the screen name), the live clock and date in Malaysia time,
          and its own rotating images. The ticker stays at the bottom.
        </p>
        <div class="layout-grid">
          ${LAYOUTS.map(l => `
            <div class="layout-tile ${layoutPick === l.id ? "selected" : ""}" data-layout="${l.id}" onclick="pickLayout('${l.id}')">
              <div class="lt-diagram lt-${l.id}"><i class="m">Main</i><i class="h"></i><i class="z"></i><i class="t"></i></div>
              <b>${l.name}</b>
              <span>${l.note}</span>
            </div>`).join("")}
        </div>
        <div style="margin-top:14px;"><button onclick="saveLayout()">Save layout</button></div>
        <div id="layoutMsg" class="msg"></div>`;
    }

    // ---------- Colours & fonts ----------

    const STYLE_DEFAULTS = {
      ticker_bg: "#0a0a0a", ticker_color: "#ffffff", ticker_font: "default",
      panel_color: "#8b1e1e", panel_text_color: "#ffffff", panel_font: "default",
    };

    function styleVal(k) { return currentScreen[k] || STYLE_DEFAULTS[k]; }

    function fontOptions(selected) {
      return SIGNAGE_FONTS.map(f =>
        `<option value="${f.id}" ${f.id === selected ? "selected" : ""} style="font-family:${f.css.replace(/"/g, "'")}">${f.name}</option>`
      ).join("");
    }

    function renderStyleCard() {
      document.getElementById("styleCard").innerHTML = `
        <h2>Colours &amp; fonts</h2>
        <p style="color:var(--muted); font-size:13px; margin-bottom:12px;">
          Match the screen to your brand. The preview below updates as you change things.
        </p>

        <h3 style="font-size:14px; margin-bottom:8px;">Ticker (scrolling message bar)</h3>
        <div class="row" style="align-items:flex-end;">
          <div style="flex:0 0 auto;"><label for="stTickerBg">Background</label>
            <input type="color" id="stTickerBg" class="color-input" value="${styleVal("ticker_bg")}" oninput="updateStylePreview()"></div>
          <div style="flex:0 0 auto;"><label for="stTickerColor">Text colour</label>
            <input type="color" id="stTickerColor" class="color-input" value="${styleVal("ticker_color")}" oninput="updateStylePreview()"></div>
          <div><label for="stTickerFont">Font</label>
            <select id="stTickerFont" onchange="updateStylePreview()">${fontOptions(styleVal("ticker_font"))}</select></div>
        </div>
        <div id="stPrevTicker" class="st-prev-ticker">Welcome to our office &bull; Opening hours 8 AM to 6 PM</div>

        <div id="panelStyle" style="display:${(currentScreen.layout || "full") === "full" ? "none" : "block"}; margin-top:18px;">
          <h3 style="font-size:14px; margin-bottom:8px;">Logo, time &amp; date panel</h3>
          <div class="row" style="align-items:flex-end;">
            <div style="flex:0 0 auto;"><label for="stPanelBg">Background</label>
              <input type="color" id="stPanelBg" class="color-input" value="${styleVal("panel_color")}" oninput="updateStylePreview()"></div>
            <div style="flex:0 0 auto;"><label for="stPanelText">Time &amp; date colour</label>
              <input type="color" id="stPanelText" class="color-input" value="${styleVal("panel_text_color")}" oninput="updateStylePreview()"></div>
            <div><label for="stPanelFont">Font</label>
              <select id="stPanelFont" onchange="updateStylePreview()">${fontOptions(styleVal("panel_font"))}</select></div>
          </div>
          <div id="stPrevPanel" class="st-prev-panel">
            <div class="st-logo">LOGO</div>
            <div><div class="st-clock">9:41 PM</div><div class="st-date">Thursday 8 Oct 2026</div></div>
          </div>
        </div>

        <div style="margin-top:16px; display:flex; gap:10px;">
          <button onclick="saveStyle()">Save colours &amp; fonts</button>
          <button class="secondary" onclick="resetStyle()">Reset to defaults</button>
        </div>
        <div id="styleMsg" class="msg"></div>`;
      updateStylePreview();
    }

    function updateStylePreview() {
      const g = id => document.getElementById(id).value;
      const t = document.getElementById("stPrevTicker");
      t.style.background = g("stTickerBg");
      t.style.color = g("stTickerColor");
      t.style.fontFamily = fontCss(g("stTickerFont"));
      const p = document.getElementById("stPrevPanel");
      if (p) {
        p.style.background = g("stPanelBg");
        p.style.color = g("stPanelText");
        p.style.fontFamily = fontCss(g("stPanelFont"));
      }
    }

    function resetStyle() {
      const set = (id, v) => { document.getElementById(id).value = v; };
      set("stTickerBg", STYLE_DEFAULTS.ticker_bg); set("stTickerColor", STYLE_DEFAULTS.ticker_color); set("stTickerFont", STYLE_DEFAULTS.ticker_font);
      set("stPanelBg", STYLE_DEFAULTS.panel_color); set("stPanelText", STYLE_DEFAULTS.panel_text_color); set("stPanelFont", STYLE_DEFAULTS.panel_font);
      updateStylePreview();
      saveStyle();
    }

    async function saveStyle() {
      const msg = document.getElementById("styleMsg");
      const g = id => document.getElementById(id).value;
      const fields = {
        ticker_bg: g("stTickerBg"), ticker_color: g("stTickerColor"), ticker_font: g("stTickerFont"),
        panel_color: g("stPanelBg"), panel_text_color: g("stPanelText"), panel_font: g("stPanelFont"),
      };
      showMessage(msg, "Saving...", false);
      const { error } = await db.from("screens").update(fields).eq("id", currentScreen.id);
      if (error) { showMessage(msg, error.message, true); return; }
      Object.assign(currentScreen, fields);
      showMessage(msg, "Saved. The screen updates within about 30 seconds.", false);
    }

    function pickLayout(id) {
      layoutPick = id;
      document.querySelectorAll(".layout-tile").forEach(t => t.classList.toggle("selected", t.dataset.layout === id));
    }

    async function saveLayout() {
      const msg = document.getElementById("layoutMsg");
      showMessage(msg, "Saving...", false);
      const { error } = await db.from("screens")
        .update({ layout: layoutPick })
        .eq("id", currentScreen.id);
      if (error) { showMessage(msg, error.message, true); return; }
      currentScreen.layout = layoutPick;
      document.getElementById("sideCard").style.display = layoutPick === "full" ? "none" : "block";
      document.getElementById("panelStyle").style.display = layoutPick === "full" ? "none" : "block";
      showMessage(msg, "Saved. The screen switches within about 30 seconds.", false);
    }

    // ---------- Menu boards ----------

    let menuDraft = null;
    let menuPreviewPage = 0;
    let menuPreviewTimer = null;

    const MENU_LOOKS = [
      { id: "dark",  name: "Dark",        chip: "#0d0d0f" },
      { id: "light", name: "Light",       chip: "#faf6ee" },
      { id: "bold",  name: "Bold colour", chip: null },
    ];

    function blankMenuItem() { return { name: "", price: "", desc: "", soldOut: false }; }

    async function loadMenus() {
      const listEl = document.getElementById("menuList");
      if (!listEl || !currentScreen) return;
      const screenId = currentScreen.id;
      const { data, error } = await db.from("menu_boards").select("*")
        .eq("screen_id", screenId).order("sort_order", { ascending: true });
      if (!currentScreen || currentScreen.id !== screenId) return;
      if (error) {
        menuCache = [];
        listEl.innerHTML = '<div class="empty">Menu boards are not set up yet. Please contact your administrator.</div>';
        return;
      }
      menuCache = data || [];
      if (!menuCache.length) { listEl.innerHTML = '<div class="empty">No menu boards yet.</div>'; return; }

      listEl.innerHTML = `
        <table>
          <thead><tr><th>Menu</th><th>Items</th><th>Schedule</th><th></th></tr></thead>
          <tbody>
            ${menuCache.map(m => {
              const slides = paginateMenu(m, 1920, 1080).length;
              return `
              <tr>
                <td><b>${escapeHtml(m.title)}</b><br>
                    <span style="color:var(--muted); font-size:12px;">${escapeHtml((MENU_LOOKS.find(l => l.id === m.template) || MENU_LOOKS[0]).name)} look</span></td>
                <td style="font-size:13px;">${menuItemCount(m)} items<br>
                    <span style="color:var(--muted); font-size:12px;">${slides} slide${slides === 1 ? "" : "s"}</span></td>
                <td style="font-size:13px;">
                  ${escapeHtml(scheduleSummary(m))}
                  ${hasSchedule(m) ? `<br><span class="pill ${isScheduledNow(m) ? 'online' : 'inactive'}">${isScheduledNow(m) ? 'Playing now' : 'Not playing now'}</span>` : ''}
                </td>
                <td style="text-align:right; white-space:nowrap;">
                  <button class="icon-btn" onclick="openMenuEditor('${m.id}')">Edit</button>
                  <button class="icon-btn" onclick="openSchedule('${m.id}', 'menu_boards')">Schedule</button>
                  <button class="icon-btn" onclick="deleteMenu('${m.id}')">Delete</button>
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`;
    }

    function openMenuEditor(id) {
      const existing = id ? menuCache.find(m => m.id === id) : null;
      if (existing) {
        menuDraft = {
          id: existing.id, title: existing.title, template: existing.template || "dark",
          accent: existing.accent || "#8b1e1e", currency: existing.currency || "",
          duration_seconds: existing.duration_seconds || 12,
          categories: (existing.categories || []).map(c => ({
            name: c.name || "",
            items: (c.items || []).map(i => ({
              name: i.name || "", price: i.price == null ? "" : String(i.price),
              desc: i.desc || "", soldOut: !!i.soldOut,
            })),
          })),
        };
        if (!menuDraft.categories.length) menuDraft.categories.push({ name: "", items: [blankMenuItem()] });
      } else {
        menuDraft = {
          id: null, title: "", template: "dark", accent: "#8b1e1e", currency: "RM", duration_seconds: 12,
          categories: [{ name: "", items: [blankMenuItem()] }],
        };
      }
      menuPreviewPage = 0;
      // Starter templates are offered only when creating a new menu.
      const starterSel = document.getElementById("mStarter");
      starterSel.innerHTML = '<option value="">Blank menu</option>' +
        MENU_STARTERS.map(x => `<option value="${x.id}">${x.name}</option>`).join("");
      document.getElementById("starterRow").style.display = existing ? "none" : "block";
      document.getElementById("menuModalTitle").textContent = existing ? "Edit menu board" : "New menu board";
      document.getElementById("mTitle").value = menuDraft.title;
      document.getElementById("mCurrency").value = menuDraft.currency;
      document.getElementById("mAccent").value = menuDraft.accent;
      document.getElementById("mDuration").value = menuDraft.duration_seconds;
      showMessage(document.getElementById("mMsg"), "", false);
      renderMenuLooks();
      renderMenuCats();
      document.getElementById("menuModal").classList.add("open");
      renderMenuPreview();
    }

    function applyStarter(id) {
      const st = MENU_STARTERS.find(x => x.id === id);
      if (!st || !menuDraft) return;
      menuDraft.title = st.title; menuDraft.template = st.template; menuDraft.accent = st.accent;
      menuDraft.categories = st.categories.map(c => ({
        name: c.name,
        items: c.items.map(i => ({ name: i.name, price: i.price || "", desc: i.desc || "", soldOut: false })),
      }));
      document.getElementById("mTitle").value = menuDraft.title;
      document.getElementById("mAccent").value = menuDraft.accent;
      menuPreviewPage = 0;
      renderMenuLooks(); renderMenuCats(); refreshMenuPreview();
    }

    function closeMenuEditor() {
      document.getElementById("menuModal").classList.remove("open");
      menuDraft = null;
    }

    function renderMenuLooks() {
      document.getElementById("mLooks").innerHTML = MENU_LOOKS.map(l => `
        <label>
          <input type="radio" name="mLook" value="${l.id}" ${menuDraft.template === l.id ? "checked" : ""}
                 onchange="menuDraft.template='${l.id}'; refreshMenuPreview()">
          <span class="look-chip" style="background:${l.chip || "linear-gradient(135deg,#b3261e,#e8590c)"}"></span> ${l.name}
        </label>`).join("");
    }

    function renderMenuCats() {
      const e = escapeHtml;
      document.getElementById("mCats").innerHTML = menuDraft.categories.map((c, ci) => `
        <div class="mcat">
          <div class="mcat-head">
            <input type="text" placeholder="Category name, e.g. Coffee" value="${e(c.name)}"
                   oninput="menuDraft.categories[${ci}].name=this.value; refreshMenuPreview()">
            <button class="icon-btn" title="Move up" onclick="moveCat(${ci},-1)">↑</button>
            <button class="icon-btn" title="Move down" onclick="moveCat(${ci},1)">↓</button>
            <button class="icon-btn" onclick="delCat(${ci})">Delete</button>
          </div>
          ${c.items.map((it, ii) => `
            <div class="mitem">
              <input type="text" class="mi-name" placeholder="Item name" value="${e(it.name)}"
                     oninput="menuDraft.categories[${ci}].items[${ii}].name=this.value; refreshMenuPreview()">
              <input type="text" class="mi-price" placeholder="Price" value="${e(it.price)}"
                     oninput="menuDraft.categories[${ci}].items[${ii}].price=this.value; refreshMenuPreview()">
              <input type="text" class="mi-desc" placeholder="Short description (optional)" value="${e(it.desc)}"
                     oninput="menuDraft.categories[${ci}].items[${ii}].desc=this.value; refreshMenuPreview()">
              <label class="mi-sold"><input type="checkbox" ${it.soldOut ? "checked" : ""}
                     onchange="menuDraft.categories[${ci}].items[${ii}].soldOut=this.checked; refreshMenuPreview()"> Sold out</label>
              <span class="mi-tools">
                <button class="icon-btn" title="Move up" onclick="moveItem(${ci},${ii},-1)">↑</button>
                <button class="icon-btn" title="Move down" onclick="moveItem(${ci},${ii},1)">↓</button>
                <button class="icon-btn" title="Remove" onclick="delItem(${ci},${ii})">✕</button>
              </span>
            </div>`).join("")}
          <button class="small secondary" style="margin-top:8px;" onclick="addItem(${ci})">+ Add item</button>
        </div>`).join("");
    }

    function addCat() { menuDraft.categories.push({ name: "", items: [blankMenuItem()] }); renderMenuCats(); refreshMenuPreview(); }
    function delCat(ci) {
      menuDraft.categories.splice(ci, 1);
      if (!menuDraft.categories.length) menuDraft.categories.push({ name: "", items: [blankMenuItem()] });
      renderMenuCats(); refreshMenuPreview();
    }
    function moveCat(ci, dir) {
      const to = ci + dir, a = menuDraft.categories;
      if (to < 0 || to >= a.length) return;
      [a[ci], a[to]] = [a[to], a[ci]];
      renderMenuCats(); refreshMenuPreview();
    }
    function addItem(ci) { menuDraft.categories[ci].items.push(blankMenuItem()); renderMenuCats(); refreshMenuPreview(); }
    function delItem(ci, ii) {
      const items = menuDraft.categories[ci].items;
      items.splice(ii, 1);
      if (!items.length) items.push(blankMenuItem());
      renderMenuCats(); refreshMenuPreview();
    }
    function moveItem(ci, ii, dir) {
      const a = menuDraft.categories[ci].items, to = ii + dir;
      if (to < 0 || to >= a.length) return;
      [a[ii], a[to]] = [a[to], a[ii]];
      renderMenuCats(); refreshMenuPreview();
    }

    // The preview draws the slide on a virtual 1920x1080 TV and scales it down to fit.
    function refreshMenuPreview() {
      clearTimeout(menuPreviewTimer);
      menuPreviewTimer = setTimeout(renderMenuPreview, 150);
    }

    function renderMenuPreview() {
      if (!menuDraft) return;
      const box = document.getElementById("mPreview");
      const nav = document.getElementById("mPreviewNav");
      const W = 1920, H = 1080;
      const pages = paginateMenu(menuDraft, W, H);
      const scale = box.clientWidth / W;
      box.style.height = (H * scale) + "px";
      box.innerHTML = "";

      if (!pages.length) {
        box.innerHTML = '<div class="mpreview-empty">Add a category with at least one item to see the preview.</div>';
        nav.innerHTML = "";
        return;
      }
      if (menuPreviewPage >= pages.length) menuPreviewPage = pages.length - 1;

      const inner = document.createElement("div");
      inner.style.cssText = `position:absolute; left:0; top:0; width:${W}px; height:${H}px; transform:scale(${scale}); transform-origin:0 0;`;
      const stage = document.createElement("div");
      stage.style.cssText = `position:absolute; left:0; top:0; width:${W}px; height:${H - MENU_TICKER_H}px;`;
      stage.appendChild(buildMenuPageEl(pages[menuPreviewPage], menuDraft, {
        w: W, fullH: H, pageNo: menuPreviewPage + 1, pageCount: pages.length,
      }));
      const bar = document.createElement("div");
      bar.style.cssText = `position:absolute; left:0; bottom:0; width:${W}px; height:${MENU_TICKER_H}px; background:#0a0a0a; border-top:3px solid #8b1e1e; color:#fff; font:600 30px 'Segoe UI',Arial,sans-serif; display:flex; align-items:center; padding-left:40px; box-sizing:border-box;`;
      bar.textContent = "Your scrolling ticker message appears here";
      inner.appendChild(stage);
      inner.appendChild(bar);
      box.appendChild(inner);

      nav.innerHTML = pages.length > 1 ? `
        <button class="small secondary" onclick="menuPreviewStep(-1)">‹ Previous</button>
        <span>Slide ${menuPreviewPage + 1} of ${pages.length}</span>
        <button class="small secondary" onclick="menuPreviewStep(1)">Next ›</button>` : "<span>1 slide</span>";
    }

    function menuPreviewStep(dir) { menuPreviewPage += dir; if (menuPreviewPage < 0) menuPreviewPage = 0; renderMenuPreview(); }

    async function saveMenu() {
      const msg = document.getElementById("mMsg");
      const d = menuDraft;
      const title = d.title.trim();
      if (!title) { showMessage(msg, "Give the menu a title.", true); return; }

      const cats = [];
      for (const c of d.categories) {
        const name = c.name.trim();
        const items = c.items
          .map(i => ({ name: i.name.trim(), price: String(i.price || "").trim(), desc: (i.desc || "").trim(), soldOut: !!i.soldOut }))
          .filter(i => i.name);
        if (!name && !items.length) continue;                       // empty block: ignore
        if (!name) { showMessage(msg, "Give every category a name, for example Coffee.", true); return; }
        if (!items.length) continue;                                // category with no items: skip
        cats.push({ name, items });
      }
      if (!cats.length) { showMessage(msg, "Add at least one item with a name.", true); return; }

      const secs = Math.min(120, Math.max(4, parseInt(d.duration_seconds, 10) || 12));
      const row = {
        title, template: d.template, accent: d.accent,
        currency: (d.currency || "").trim(), categories: cats, duration_seconds: secs,
      };

      const btn = document.getElementById("mSaveBtn");
      btn.disabled = true;
      const res = d.id
        ? await db.from("menu_boards").update(row).eq("id", d.id).select()
        : await db.from("menu_boards").insert(Object.assign({ screen_id: currentScreen.id, sort_order: Date.now() }, row)).select();
      btn.disabled = false;

      if (res.error) { showMessage(msg, res.error.message, true); return; }
      if (!res.data || !res.data.length) { showMessage(msg, "Could not save. Please contact your administrator.", true); return; }
      closeMenuEditor();
      await loadMenus();
    }

    async function deleteMenu(id) {
      if (!confirm("Delete this menu board?")) return;
      const { error } = await db.from("menu_boards").delete().eq("id", id);
      if (error) { alert(error.message); return; }
      await loadMenus();
    }

    // ---------- Scheduling ----------

    let scheduleItemId = null;
    let scheduleTable = "media_items";

    (function buildScheduleControls() {
      document.getElementById("schedDays").innerHTML = [1,2,3,4,5,6,0].map(d =>
        `<label><input type="checkbox" class="schedDay" value="${d}"> ${DAY_NAMES[d]}</label>`
      ).join("");
      ["From", "Until"].forEach(which => {
        document.getElementById("sched" + which).innerHTML = timeSelectsHtml("sched" + which);
      });
    })();

    // Hour / minute / AM-PM dropdowns. `prefix` makes the element ids unique.
    function timeSelectsHtml(prefix) {
      const hours = Array.from({length: 12}, (_, i) => i + 1)
        .map(h => `<option value="${h}">${h}</option>`).join("");
      const mins = Array.from({length: 12}, (_, i) => i * 5)
        .map(m => `<option value="${m}">${String(m).padStart(2, "0")}</option>`).join("");
      return `
        <select id="${prefix}H">${hours}</select>
        <span>:</span>
        <select id="${prefix}M">${mins}</select>
        <select id="${prefix}AP"><option value="AM">AM</option><option value="PM">PM</option></select>`;
    }

    function setTimeOn(prefix, t) {
      const total = timeToMinutes(t);
      let h = Math.floor(total / 60);
      const m = total % 60;
      const ap = h >= 12 ? "PM" : "AM";
      h = h % 12; if (h === 0) h = 12;
      document.getElementById(prefix + "H").value = String(h);
      document.getElementById(prefix + "M").value = String(m);
      document.getElementById(prefix + "AP").value = ap;
    }

    function getTimeFrom(prefix) {
      let h = parseInt(document.getElementById(prefix + "H").value, 10);
      const m = parseInt(document.getElementById(prefix + "M").value, 10);
      const ap = document.getElementById(prefix + "AP").value;
      if (ap === "AM" && h === 12) h = 0;
      if (ap === "PM" && h !== 12) h += 12;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":00";
    }

    function setTimeSelects(which, t) { setTimeOn("sched" + which, t); }
    function getTimeSelects(which) { return getTimeFrom("sched" + which); }

    function toggleAllDay() {
      document.getElementById("schedTimes").style.display =
        document.getElementById("schedAllDay").checked ? "none" : "block";
    }

    function openSchedule(id, table) {
      table = table || "media_items";
      const item = (table === "menu_boards" ? menuCache : mediaCache).find(m => m.id === id);
      if (!item) return;
      scheduleItemId = id;
      scheduleTable = table;
      document.getElementById("schedFile").textContent =
        item.storage_path ? item.storage_path.split("/").pop() : "Menu board: " + item.title;

      const days = item.schedule_days || [];
      document.querySelectorAll(".schedDay").forEach(cb => {
        cb.checked = days.indexOf(parseInt(cb.value, 10)) !== -1;
      });

      const hasTimes = item.schedule_start && item.schedule_end &&
        timeToMinutes(item.schedule_start) !== timeToMinutes(item.schedule_end);
      document.getElementById("schedAllDay").checked = !hasTimes;
      setTimeSelects("From", hasTimes ? item.schedule_start : "09:00:00");
      setTimeSelects("Until", hasTimes ? item.schedule_end : "17:00:00");
      toggleAllDay();

      document.getElementById("schedStartDate").value = item.schedule_start_date || "";
      document.getElementById("schedEndDate").value = item.schedule_end_date || "";
      showMessage(document.getElementById("schedMsg"), "", false);
      document.getElementById("scheduleModal").classList.add("open");
    }

    function closeSchedule() {
      document.getElementById("scheduleModal").classList.remove("open");
      scheduleItemId = null;
    }

    async function writeSchedule(fields) {
      const msg = document.getElementById("schedMsg");
      const btn = document.getElementById("schedSaveBtn");
      btn.disabled = true;
      const { data, error } = await db.from(scheduleTable)
        .update(fields).eq("id", scheduleItemId).select();
      btn.disabled = false;
      if (error) { showMessage(msg, error.message, true); return; }
      if (!data || !data.length) {
        showMessage(msg, "Could not save. Ask your administrator to check the scheduling permissions.", true);
        return;
      }
      closeSchedule();
      await loadMedia();
      await loadMenus();
    }

    async function saveSchedule() {
      const msg = document.getElementById("schedMsg");
      let days = Array.from(document.querySelectorAll(".schedDay"))
        .filter(cb => cb.checked).map(cb => parseInt(cb.value, 10)).sort();
      if (days.length === 0 || days.length === 7) days = null;

      let start = null, end = null;
      if (!document.getElementById("schedAllDay").checked) {
        start = getTimeSelects("From");
        end = getTimeSelects("Until");
        if (start === end) {
          showMessage(msg, "'From' and 'Until' cannot be the same time. Tick 'Play all day' instead.", true);
          return;
        }
      }

      const startDate = document.getElementById("schedStartDate").value || null;
      const endDate = document.getElementById("schedEndDate").value || null;
      if (startDate && endDate && startDate > endDate) {
        showMessage(msg, "The end date cannot be before the start date.", true);
        return;
      }

      await writeSchedule({
        schedule_days: days,
        schedule_start: start,
        schedule_end: end,
        schedule_start_date: startDate,
        schedule_end_date: endDate,
      });
    }

    async function clearSchedule() {
      await writeSchedule({
        schedule_days: null, schedule_start: null, schedule_end: null,
        schedule_start_date: null, schedule_end_date: null,
      });
    }

    // Keep the "Playing now" badges fresh.
    setInterval(() => {
      if (currentScreen && !document.getElementById("scheduleModal").classList.contains("open")) { loadMedia(); loadMenus(); }
    }, 60000);

    async function uploadMedia(zone) {
      zone = zone === "side" ? "side" : "main";
      const ids = zone === "side"
        ? { file: "sideFile", msg: "sideMsg", btn: "sideUploadBtn" }
        : { file: "mediaFile", msg: "mediaMsg", btn: "uploadBtn" };
      const fileInput = document.getElementById(ids.file);
      const msg = document.getElementById(ids.msg);
      const file = fileInput.files[0];
      if (!file) { showMessage(msg, "Choose a file first.", true); return; }
      if (zone === "side" && !file.type.startsWith("image")) { showMessage(msg, "The side panel shows images only.", true); return; }

      const btn = document.getElementById(ids.btn);
      btn.disabled = true;
      showMessage(msg, "Uploading...", false);

      const type = file.type.startsWith("video") ? "video" : "image";
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = `${myProfile.org_id}/${currentScreen.id}/${Date.now()}-${safeName}`;

      const { error: uploadError } = await db.storage.from("media").upload(path, file);
      if (uploadError) { showMessage(msg, uploadError.message, true); btn.disabled = false; return; }

      const row = { screen_id: currentScreen.id, type, storage_path: path, sort_order: Date.now() };
      if (zone === "side") row.zone = "side";
      const { error: insertError } = await db.from("media_items").insert(row);
      if (insertError) { showMessage(msg, insertError.message, true); btn.disabled = false; return; }

      fileInput.value = "";
      showMessage(msg, "Uploaded.", false);
      btn.disabled = false;
      await loadMedia();
    }

    async function deleteMedia(id, storagePath) {
      if (!confirm("Delete this file?")) return;
      await db.storage.from("media").remove([storagePath]);
      await db.from("media_items").delete().eq("id", id);
      await loadMedia();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
  </script>
</body>
</html>
