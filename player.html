<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Signage</title>
<link rel="stylesheet" href="assets/player.css">
<link rel="stylesheet" href="assets/menu.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;600;700&display=swap">
</head>
<body>
  <div id="stage">
    <div id="stage-empty">Loading...</div>
  </div>

  <img id="signage-logo" style="display:none;">

  <!-- Side panel: used by the sidebar / bottom-strip layouts (hidden in full screen) -->
  <aside id="side">
    <div id="side-head">
      <img id="side-logo" alt="">
      <div id="side-name"></div>
      <div id="side-time">
        <div id="side-clock"></div>
        <div id="side-date"></div>
      </div>
    </div>
    <div id="side-zone"></div>
  </aside>


  <div id="ticker-bar">
    <div id="ticker-track"></div>
  </div>

  <script src="assets/vendor/supabase.js"></script>
  <script src="assets/fonts.js"></script>
  <script src="assets/schedule.js"></script>
  <script src="assets/menu.js"></script>
  <script src="assets/player.js"></script>

</html>
