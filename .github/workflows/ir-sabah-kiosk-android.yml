name: Build IR-Sabah Kiosk (Android)

on:
  push:
    branches: [main]
    paths: ["ir-sabah-kiosk-android/**", ".github/workflows/ir-sabah-kiosk-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: ir-sabah-kiosk-android
        run: gradle --no-daemon assembleDebug
      - name: Keep a copy for download
        run: |
          mkdir -p downloads
          cp ir-sabah-kiosk-android/app/build/outputs/apk/debug/app-debug.apk downloads/ir-sabah-kiosk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ir-sabah-kiosk-apk
          path: downloads/ir-sabah-kiosk.apk
      - name: Publish APK to the website
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/ir-sabah-kiosk.apk
          git diff --cached --quiet || (git commit -m "Update IR-Sabah kiosk APK [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)
