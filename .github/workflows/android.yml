name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Keep a copy for download
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/click4tech-signage.apk
      - uses: actions/upload-artifact@v4
        with:
          name: click4tech-signage-apk
          path: downloads/click4tech-signage.apk
      - name: Publish APK to the website
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/click4tech-signage.apk
          git diff --cached --quiet || (git commit -m "Update Android app download [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)
